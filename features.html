<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>See It In Action &mdash; Virtual Archive</title>
<meta name="description" content="Real screenshots from Virtual Archive -- browsing by category, adding an item, searching, generating reports, and more.">
<link rel="canonical" href="https://virtualarchive.org/features.html">
<link rel="icon" href="favicon.ico">
<meta property="og:title" content="See It In Action — Virtual Archive">
<meta property="og:description" content="Real screenshots from Virtual Archive -- browsing by category, adding an item, searching, generating reports, and more.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://virtualarchive.org/features.html">
<meta property="og:image" content="https://virtualarchive.org/images/hero-maritime-folder.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div style="width: 100%; display: flex; flex-direction: column; align-items: stretch; background: #f6f1e7;">

<!-- NAV -->
  <div style="display: flex; justify-content: space-between; align-items: center; padding: 12px 48px; border-bottom: 1px solid #e3d8bf;">
    <a href="index.html" style="font-family: 'Fraunces', Georgia, serif; font-size: 34px; font-weight: 600; color: #0d2a63;">Virtual Archive</a>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <a href="index.html" class="navlink navlink-inactive">Home</a>
      <a href="what-it-does.html" class="navlink navlink-inactive">What it does</a>
      <a href="about.html" class="navlink navlink-inactive">About</a>
      <a href="features.html" class="navlink navlink-active">See it in action</a>
      <a href="help.html" class="navlink navlink-inactive">Help</a>
      <a href="download.html" class="navlink navlink-inactive">Get it</a>
    </div>
  </div>

  <!-- GALLERY -->
  <div id="gallery" style="padding: 28px 48px 64px 48px; max-width: 1280px; margin: 0 auto; width: 100%; box-sizing: border-box;">
    <p style="font-size: 15px; color: #4a4330; margin-bottom: 24px; max-width: 560px;">Real screens from the program &mdash; click any one to see it full size.</p>
    <div id="galleryGrid" style="display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 20px;"></div>
  </div>

  <div id="lightbox" class="lightbox-overlay" style="display: none;">
    <div style="width: min(1100px, 92vw); max-height: 90vh; display: flex; flex-direction: column; gap: 10px; align-items: center;">
      <img id="lightboxImg" src="" alt="" style="width: 100%; max-height: 78vh; object-fit: contain; border-radius: 6px; box-shadow: 0 20px 60px rgba(0,0,0,0.5);">
      <div id="lightboxCaption" style="color: #fff; font-size: 14px; font-weight: 600;"></div>
    </div>
  </div>

  <!-- FOOTER -->
  <div style="padding: 24px 48px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #8a7f63; border-top: 1px solid #e3d8bf;">
    <div>virtualarchive.org</div>
    <div>Virtual Archive &copy; 2014&ndash;2026</div>
  </div>
</div>

<script>
  var GALLERY = [
    { src: 'images/adding-an-item.png', caption: 'Adding an item', alt: 'Adding an item, with the location directory alongside it and rich text formatting in the description' },
    { src: 'images/editing-item-personal.png', caption: 'Editing an item — Personal', alt: 'Editing an item, Personal edition' },
    { src: 'images/editing-item-museum.png', caption: 'Editing an item — Museum', alt: 'Editing an item, Museum edition with metadata' },
    { src: 'images/browsing-locating-item.png', caption: 'Browsing — locating item', alt: 'Locating an item by category in Virtual Archive' },
    { src: 'images/browsing-by-category.png', caption: 'Browsing by category', alt: 'Browsing categories as folders' },
    { src: 'images/searching-items.png', caption: 'Searching for items', alt: 'Searching for "violin" across the collection, with matches highlighted' },
    { src: 'images/creating-from-template.png', caption: 'Creating a file from a template', alt: 'Creating a layout file from a template, with a live preview' },
    { src: 'images/ordering-album.png', caption: 'Ordering an album', alt: 'Reordering pictures in an album by clicking, drag-and-drop style' },
    { src: 'images/building-accession-form.jpg', caption: 'Building an accession form', alt: 'Building an accession form, Museum edition' },
    { src: 'images/jumping-to-help-topic.png', caption: 'Jumping to a Help topic', alt: 'The built-in Help screen, with the jump-to-a-section dropdown open' },
    { src: 'images/reports-and-more-menu.png', caption: 'Reports and More menu', alt: 'The Reports and More menu' },
    { src: 'images/program-settings.png', caption: 'Program settings', alt: 'The program settings screen' }
  ];

  var grid = document.getElementById('galleryGrid');
  GALLERY.forEach(function (shot) {
    var card = document.createElement('div');
    card.style.cssText = 'cursor: pointer; background: #fff; border: 1px solid #e3d8bf; border-radius: 10px; overflow: hidden;';
    card.innerHTML =
      '<img src="' + shot.src + '" alt="' + shot.alt + '" style="display:block;width:100%;height:190px;object-fit:cover;object-position:top;border-bottom:1px solid #e3d8bf;">' +
      '<div style="padding: 12px 14px; font-size: 13px; font-weight: 600; color: #0d2a63;">' + shot.caption + '</div>';
    card.addEventListener('click', function () { openLightbox(shot.src, shot.alt); });
    grid.appendChild(card);
  });

  var lightbox = document.getElementById('lightbox');
  var lightboxImg = document.getElementById('lightboxImg');
  var lightboxCaption = document.getElementById('lightboxCaption');

  function openLightbox(src, alt) {
    lightboxImg.src = src;
    lightboxImg.alt = alt;
    lightboxCaption.textContent = alt;
    lightbox.style.display = 'flex';
  }
  function closeLightbox() { lightbox.style.display = 'none'; }
  lightbox.addEventListener('click', closeLightbox);
</script>
</body>
</html>
